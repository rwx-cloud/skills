on:
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}

concurrency-pools:
  - id: rwx-cloud/skills:${{ init.branch }}
    capacity: 1
    on-overflow: cancel-running

base:
  image: ubuntu:26.04
  config: rwx/base 1.2.1

tasks:
  - key: code
    call: git/clone 2.4.1
    with:
      repository: https://github.com/rwx-cloud/skills.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true

  - key: tool-versions
    use: code
    call: rwx/tool-versions 1.1.0
    filter:
      - .tool-versions

  - key: nodejs
    call: nodejs/install 1.2.1
    with:
      node-version: ${{ tasks.tool-versions.values.nodejs }}

  - key: prettier
    use: [code, nodejs]
    run: npx --yes prettier@3.8.3 --check "**/*.md"

  - key: validate-agent-plugins-schema
    use: [code, nodejs]
    run: |
      curl -fsSL https://agent-plugins.org/schemas/1.0.0/plugin.schema.json -o /tmp/agent-plugin.schema.json
      curl -fsSL https://agent-plugins.org/schemas/1.0.0/mcp.schema.json -o /tmp/agent-mcp.schema.json
      npx --yes --package ajv-cli@5.0.0 --package ajv-formats@3.0.1 ajv validate --spec=draft2020 -c ajv-formats -s /tmp/agent-plugin.schema.json -d 'plugins/*/plugin.json'
      npx --yes --package ajv-cli@5.0.0 --package ajv-formats@3.0.1 ajv validate --spec=draft2020 -c ajv-formats -s /tmp/agent-mcp.schema.json -d plugins/rwx-mcp/mcp.json

  - key: plugin-marketplaces
    use: [code, nodejs]
    run: |
      export CODEX_HOME="$HOME/.codex-marketplace-test" COPILOT_HOME="$HOME/.copilot-marketplace-test"
      mkdir -p "$CODEX_HOME" "$COPILOT_HOME"
      npx --yes @openai/codex@0.170.0 plugin marketplace add "$PWD"
      npx --yes @openai/codex@0.170.0 plugin marketplace list
      npx --yes @github/copilot@1.0.114 plugin marketplace add "$PWD"
      npx --yes @github/copilot@1.0.114 plugin marketplace browse rwx --json
      npx --yes @github/copilot@1.0.114 plugin install rwx@rwx
      npx --yes @github/copilot@1.0.114 plugin install rwx-mcp@rwx

  - key: install-skills
    use: [code, nodejs]
    run: npx skills add . -y

  - key: claude-plugins
    use: [code, nodejs]
    run: |
      npx --yes @anthropic-ai/claude-code plugin validate ./.claude-plugin/marketplace.json
      npx --yes @anthropic-ai/claude-code plugin marketplace add ./.claude-plugin/marketplace.json
      npx --yes @anthropic-ai/claude-code plugin install rwx@rwx
      npx --yes @anthropic-ai/claude-code plugin install rwx-mcp@rwx
